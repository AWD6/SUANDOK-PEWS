
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUANDOK PEWS - Pediatric Early Warning Signs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>SUANDOK PEWS</h1>
            <p>Pediatric Early Warning Signs</p>
        </header>

        <main class="main-card">
            <div class="form-section">
                <label for="hn-input">เลข HN ผู้ป่วย</label>
                <input type="text" id="hn-input" placeholder="กรอกเลข HN (ไม่บังคับ)">
            </div>

            <div class="form-section">
                <label for="location-input">Location</label>
                <select id="location-input">
                    <option value="">เลือก Location</option>
                    <option value="Ward">Ward</option>
                    <option value="ICU">ICU</option>
                    <option value="ER">ER</option>
                    <option value="OR">OR</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
                <input type="text" id="location-other" placeholder="ระบุ Location อื่นๆ" style="display:none; margin-top: 10px;">
            </div>

            <div class="form-section">
                <h3>เลือกกลุ่มอายุ (Age Group)</h3>
                <div class="age-group-grid" id="age-group-grid"></div>
            </div>

            <div class="form-section">
                <h3>📊 สัญญาณชีพ (Vital Signs)</h3>
                <div class="vital-signs-header">
                    <button type="button" id="chd-button" class="chd-button">Congenital heart disease</button>
                </div>
                <div id="chd-selected" class="chd-selected" style="display:none;">
                    <span id="chd-type-display"></span>
                    <button type="button" id="chd-clear" class="chd-clear-btn">ยกเลิก</button>
                </div>
                <div class="vital-signs-grid">
                    <div class="vital-input">
                        <label for="temp">Temp (°C)</label>
                        <input type="number" id="temp" step="0.1" min="30" max="45" placeholder="°C">
                    </div>
                    <div class="vital-input">
                        <label for="pulse">PR (bpm)</label>
                        <input type="number" id="pulse" min="0" max="300" placeholder="bpm">
                    </div>
                    <div class="vital-input">
                        <label for="rr">RR (tpm)</label>
                        <input type="number" id="rr" min="0" max="200" placeholder="tpm">
                    </div>
                    <div class="vital-input">
                        <label for="bp">BP (mmHg)</label>
                        <input type="text" id="bp" maxlength="7" placeholder="mmHg">
                    </div>
                    <div class="vital-input">
                        <label for="spo2">SpO₂ (%)</label>
                        <input type="number" id="spo2" min="0" max="100" placeholder="%">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Behavior</h3>
                <div class="score-grid" id="behavior-grid"></div>
            </div>

            <div class="form-section">
                <h3>Cardiovascular</h3>
                <div class="score-grid" id="cardiovascular-grid"></div>
            </div>

            <div class="form-section">
                <h3>Respiratory</h3>
                <div class="score-grid" id="respiratory-grid"></div>
            </div>

            <div class="form-section">
                <div class="additional-risk">
                    <label>
                        <input type="checkbox" id="additional-risk">
                        Additional Risk (ติ๊กถ้ามี)
                    </label>
                </div>
                <button type="button" id="pals-button" class="pals-button">PALS</button>
            </div>

            <div class="total-score-display" id="total-score-display">
                <div class="score-label">คะแนนรวม PEWS</div>
                <div class="score-value" id="score-value">0</div>
                <div class="risk-level" id="risk-level">Risk Level: Low</div>
            </div>

            <div class="form-section">
                <label for="nursing-notes">Nursing Notes</label>
                <textarea id="nursing-notes" rows="3" placeholder="บันทึกข้อมูลเพิ่มเติม..."></textarea>
            </div>

            <div class="form-section">
                <label for="transfer-destination">Transfer Destination</label>
                <input type="text" id="transfer-destination" placeholder="ระบุจุดหมายปลายทาง">
            </div>

            <div class="form-section">
                <button type="button" id="submit-button" class="submit-button">บันทึกข้อมูล</button>
            </div>

            <div id="records-section" class="records-section" style="display:none;">
                <h3>ประวัติการบันทึก</h3>
                <div id="records-list"></div>
            </div>
        </main>
    </div>

    <!-- CHD Dialog -->
    <div id="chd-dialog" class="dialog" style="display:none;">
        <div class="dialog-content">
            <h3>เลือกประเภท CHD</h3>
            <div class="chd-options">
                <button type="button" class="chd-option-btn" data-type="acyanotic">Acyanotic CHD</button>
                <button type="button" class="chd-option-btn" data-type="cyanotic">Cyanotic CHD</button>
            </div>
            <button type="button" id="chd-dialog-close" class="dialog-close">ปิด</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
